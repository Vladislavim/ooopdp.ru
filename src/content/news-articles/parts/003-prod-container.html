

    <section class="prod-container articles-index-rail" aria-label="Темы материалов">
      <nav class="prod-catalog-tabs articles-index-tabs">
        <a href="#all" class="is-active" data-filter="all" aria-current="page">Все материалы <span class="articles-index-tab-count">11</span></a>
        <a href="#articles" data-filter="articles">Статьи и практика <span class="articles-index-tab-count">4</span></a>
        <a href="#cases" data-filter="cases">Кейсы проектов <span class="articles-index-tab-count">3</span></a>
        <a href="#documents" data-filter="documents">Документы <span class="articles-index-tab-count">4</span></a>
      </nav>
      <script>
      document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.articles-index-tabs a');
        const items = document.querySelectorAll('.articles-index-card, .articles-index-featured, .articles-index-documents');
        tabs.forEach(tab => {
          tab.addEventListener('click', (e) => {
            e.preventDefault();
            tabs.forEach(t => {
              t.classList.remove('is-active');
              t.removeAttribute('aria-current');
            });
            tab.classList.add('is-active');
            tab.setAttribute('aria-current', 'page');
            const filter = tab.getAttribute('data-filter');
            items.forEach(item => {
              const cat = item.getAttribute('data-category');
              if (filter === 'all' || cat === filter) {
                item.classList.remove('is-filtered-out');
              } else {
                item.classList.add('is-filtered-out');
              }
            });
            document.getElementById('catalog')?.classList.toggle('is-filtered-out', filter === 'documents');
          });
        });
      });
      </script>
    </section>
